version: '3.9'

services:
  postgres-social-network-1:
    container_name: postgres-social-network-1
    image: "postgres:latest"
    environment:
      POSTGRES_DB: "social_network"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
    volumes:
      - ./postgres/psn1:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"

  postgres-social-network-2:
    container_name: postgres-social-network-2
    image: "postgres:latest"
    environment:
      POSTGRES_DB: "social_network"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
    volumes:
      - ./postgres/psn2:/var/lib/postgresql/data
#    ports:
#      - "25432:5432"

  postgres-social-network-3:
    container_name: postgres-social-network-3
    image: "postgres:latest"
    environment:
      POSTGRES_DB: "social_network"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
    volumes:
      - ./postgres/psn3:/var/lib/postgresql/data
#    ports:
#      - "35432:5432"

  server-1:
    container_name: server-1
    image: "feardude/social-network:0.1.1-SNAPSHOT"
    environment:
      JWT_KEY: $JWT_KEY
      DB_HOST: "haproxy"
      DB_USERNAME: $DB_USERNAME
      DB_PASSWORD: $DB_PASSWORD
      RABBITMQ_HOST: "rabbitmq"
      REDIS_HOST: "redis"
      LOGGING_LEVEL_RU_SMAX: "info"
    ports:
      - "8081:8080"

  server-2:
    container_name: server-2
    image: "feardude/social-network:0.1.1-SNAPSHOT"
    environment:
      JWT_KEY: $JWT_KEY
      DB_HOST: "haproxy"
      DB_USERNAME: $DB_USERNAME
      DB_PASSWORD: $DB_PASSWORD
      RABBITMQ_HOST: "rabbitmq"
      REDIS_HOST: "redis"
      LOGGING_LEVEL_RU_SMAX: "info"
    ports:
      - "8082:8080"

  haproxy:
    container_name: haproxy
    image: "haproxy:latest"
    ports:
      - "5432:5432"
      - "5433:5433"
      - "8888:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server-1
      - server-2

  rabbitmq:
    container_name: rabbitmq
    image: "rabbitmq:latest"
    ports:
      - "5672:5672"

  redis:
    container_name: redis
    image: "redis:latest"
    ports:
      - "6379:6379"
